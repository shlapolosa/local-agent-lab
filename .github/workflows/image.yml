# ONE image for every lab role — built here, pulled by every Railway service.
#
# Why: each of the six substrate services plus each workload used to build deploy/Dockerfile from
# this repo independently — six identical builds per deploy, each paying its own export/push
# (measured 14-20 s) and its own prisma step. Building once and deploying the same immutable tag
# turns a deploy into six pulls, and guarantees every role runs identical bits.
#
# Railway pulls `ghcr.io/<owner>/<repo>:main` (deploy/railway.py IMAGE). The GHCR package must be
# PUBLIC for an unauthenticated pull — set it once under Packages -> Package settings -> Change
# visibility. Otherwise give the Railway services a registry credential.
#
# Roll back or pin: LAB_IMAGE_TAG=sha-<short sha> python deploy/railway.py substrate up
name: image

on:
  push:
    branches: [main]
    paths:                       # docs/tests never change the image
      - "src/**"
      - "skills/**"
      - "config/**"
      - "scripts/**"
      - "pyproject.toml"
      - "deploy/Dockerfile"
      - "deploy/requirements.txt"
      - "deploy/requirements-dev.txt"
      - "tests/**"                 # the suite GATES the build now, so a test change must run it
      - ".github/workflows/image.yml"
  workflow_dispatch:             # manual rebuild (e.g. after changing the base image)

concurrency:                     # a newer commit supersedes an in-flight build
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite GATES everything below it. Before the pipeline deployed itself a red commit sat on
  # main until somebody deployed it; now it would reach all 14 services inside two minutes, so
  # "the tests passed on my machine" is no longer a control — this is.
  #
  # It runs `tests/run.sh`, the same entry point a developer runs, rather than a pytest line of its
  # own: two runners drift, and the one that drifts is always the one nobody watches. That script
  # wants `.venv`, so the job builds one.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"    # litellm needs >=3.11; the image is 3.12

      # litellm + agent_framework + rdflib + streamlit is a slow install and it changes rarely.
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('deploy/requirements.txt', 'deploy/requirements-dev.txt', 'pyproject.toml') }}

      - name: install
        run: |
          [ -d .venv ] || python -m venv .venv
          .venv/bin/pip install -q -r deploy/requirements.txt -e . -r deploy/requirements-dev.txt

      # NO .env on the runner, deliberately: the suite is offline by contract (CLAUDE.md), and a
      # test that only passes because a real credential happened to be present is a test that is
      # lying. If this job fails where a laptop passes, that coupling is the finding.
      # If the single process is ever OOM-killed here (the symptom is dots and then no summary),
      # `tests/run.sh --by-tier` is the sized-process fallback.
      - run: tests/run.sh
  build:
    needs: test                  # nothing is built, and therefore nothing ships, on a red suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # push to GHCR as the workflow's own token
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the commit, INSIDE the image. A running container then reports what it actually is,
          # which a tag cannot: a mutable tag makes every service claim the same version while the
          # bits behind it differ per pull.
          build-args: LAB_BUILD_SHA=${{ github.sha }}
          platforms: linux/amd64        # Railway runs amd64; a second arch doubles build time
          cache-from: type=gha
          cache-to: type=gha,mode=max   # layer cache across runs: only changed layers rebuild

      - name: smoke — every role's module imports in the built image
        run: |
          docker run --rm --entrypoint python \
            ghcr.io/${{ github.repository }}:sha-$(git rev-parse --short HEAD) -c "
          import importlib
          for m in ('lab.substrate.mcp.adoit.server', 'lab.substrate.mcp.semantic.server',
                    'lab.substrate.mcp.storage.server', 'lab.substrate.channels.telegram',
                    'lab.workloads.visio_to_archimate.consumer', 'lab.substrate.gateway.custom_auth'):
              importlib.import_module(m); print('ok', m)
          "

  # ---------------------------------------------------------------------------------------------
  # CD. A push that changes the image is a push that should be RUNNING, not one that waits for
  # somebody to remember to deploy it — that gap is exactly how a workload and the gateway came to
  # run different commits. Railway cannot do this itself here: its auto-deploy watches a connected
  # GITHUB REPO, and every service in this project is an IMAGE service on an immutable tag, which
  # Railway does not poll. So the trigger is external, and it is the same `deploy/railway.py` a
  # person would run — never a dashboard click, never an ad-hoc API call.
  #
  # `release` SETS THE IMAGE AND REDEPLOYS. It writes no environment variables, on purpose: pushing
  # env means holding `.env` — Neon, Entra, Graph, the LiteLLM master key — and putting all of that
  # into GitHub Actions is a far larger blast radius than shipping code deserves. So CD ships CODE
  # and a human ships CONFIGURATION: a new service, a new secret or a changed grant stays a
  # deliberate `substrate up` from a machine that has `.env`.
  #
  # Skipped, not failed, when the Railway secrets are absent — a fork, or a repo whose owner has not
  # wired a project, should still get its image built.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:                 # never two releases racing onto the same project
      group: railway-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4      # railway.py derives the image tag from HEAD

      # `.env` is the deploy profile: `load_env_for_cloud()` reads it and lets its `# CLOUD:` lines
      # win. It is held as ONE secret rather than one-per-key because those override lines carry
      # meaning no name/value pair can (they redirect Redis, tracing and the URLs for the cloud
      # tier), and because one blob is one rotation point instead of 28 that drift.
      - name: materialise the deploy profile
        env:
          LAB_ENV: ${{ secrets.LAB_ENV }}
        run: |
          if [ -z "$LAB_ENV" ]; then echo "::notice::no LAB_ENV — nothing to configure"; exit 0; fi
          printf '%s' "$LAB_ENV" > .env            # never echoed; the file is gone with the runner
          echo "deploy profile: $(grep -c '^[A-Z_]*=' .env) keys, $(grep -c '^# CLOUD:' .env) cloud overrides"

      - name: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::no RAILWAY_TOKEN — image built, deploy skipped"; exit 0
          fi
          # `substrate up` when there is a profile to push (creates missing services AND writes each
          # role's env slice AND deploys); `release` when there is not (image + redeploy only), so a
          # fork or a repo without LAB_ENV still ships code. Both log key NAMES and never values.
          if [ -s .env ]; then
            python deploy/railway.py substrate up   # stdlib only: no pip install needed
            # The workload list comes from `WORKLOADS` itself, not from this file. It used to be
            # spelled out here, so a new business process shipped its substrate on push and its
            # HOST only when somebody remembered to edit CI — which is the same class of drift the
            # image pinning exists to stop, one layer up.
            # Captured and checked, NOT inlined into the `for`: bash's `set -e` does not check a
            # command substitution in a for-list, so a failing `workload list` would iterate zero
            # times and the step would SUCCEED having deployed nothing — the same shape as the
            # silent tag fallback this file's pinning exists to prevent.
            workloads=$(python deploy/railway.py workload list) || exit 1
            [ -n "$workloads" ] || { echo "::error::no workloads listed"; exit 1; }
            for w in $workloads; do python deploy/railway.py workload "$w" up; done
          else
            python deploy/railway.py release
          fi

      - name: verify — one build everywhere, and it is the one just pushed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          [ -n "$RAILWAY_TOKEN" ] || exit 0
          python deploy/railway.py substrate images
          # what each container SAYS it is, which a tag cannot tell you — a tag that moves under a
          # service that never restarted leaves it serving the previous build
          python deploy/railway.py substrate versions

      # The third leg of the identity claim. A virtual key says what an agent may spend and reach;
      # an Entra app registration says who it IS; the card is what makes either DISCOVERABLE. The
      # first two are provisioned by a human against a live tenant, but the card describes what the
      # CODE is — its name, its model, the processes it serves — so it must follow the code, not a
      # memory. Published here rather than at service start because `POST /v1/agents` is an admin
      # write (an agent's own key gets 403), and an agent that could register agents could register
      # a more privileged one.
      #
      # AGENT_REGISTRY is a default, not a decision: `.env` is sourced after it, so a deploy profile
      # naming a different destination — or none — wins. Without LAB_ENV there is no master key and
      # nothing to publish to, so a fork skips it.
      - name: publish the agent cards
        env:
          AGENT_REGISTRY: litellm
        run: |
          if [ ! -s .env ]; then echo "::notice::no deploy profile — agent cards not published"; exit 0; fi
          set -a && . ./.env && set +a
          python scripts/register_agents.py --public
