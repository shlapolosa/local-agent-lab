# ONE image for every lab role — built here, pulled by every Railway service.
#
# Why: each of the six substrate services plus each workload used to build deploy/Dockerfile from
# this repo independently — six identical builds per deploy, each paying its own export/push
# (measured 14-20 s) and its own prisma step. Building once and deploying the same immutable tag
# turns a deploy into six pulls, and guarantees every role runs identical bits.
#
# Railway pulls `ghcr.io/<owner>/<repo>:main` (deploy/railway.py IMAGE). The GHCR package must be
# PUBLIC for an unauthenticated pull — set it once under Packages -> Package settings -> Change
# visibility. Otherwise give the Railway services a registry credential.
#
# Roll back or pin: LAB_IMAGE_TAG=sha-<short sha> python deploy/railway.py substrate up
name: image

on:
  push:
    branches: [main]
    paths:                       # docs/tests never change the image
      - "src/**"
      - "skills/**"
      - "config/**"
      - "scripts/**"
      - "pyproject.toml"
      - "deploy/Dockerfile"
      - "deploy/requirements.txt"
      - ".github/workflows/image.yml"
  workflow_dispatch:             # manual rebuild (e.g. after changing the base image)

concurrency:                     # a newer commit supersedes an in-flight build
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # push to GHCR as the workflow's own token
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the commit, INSIDE the image. A running container then reports what it actually is,
          # which a tag cannot: a mutable tag makes every service claim the same version while the
          # bits behind it differ per pull.
          build-args: LAB_BUILD_SHA=${{ github.sha }}
          platforms: linux/amd64        # Railway runs amd64; a second arch doubles build time
          cache-from: type=gha
          cache-to: type=gha,mode=max   # layer cache across runs: only changed layers rebuild

      - name: smoke — every role's module imports in the built image
        run: |
          docker run --rm --entrypoint python \
            ghcr.io/${{ github.repository }}:sha-$(git rev-parse --short HEAD) -c "
          import importlib
          for m in ('lab.substrate.mcp.adoit.server', 'lab.substrate.mcp.semantic.server',
                    'lab.substrate.mcp.storage.server', 'lab.substrate.channels.telegram',
                    'lab.workloads.visio_to_archimate.consumer', 'lab.substrate.gateway.custom_auth'):
              importlib.import_module(m); print('ok', m)
          "

  # ---------------------------------------------------------------------------------------------
  # CD. A push that changes the image is a push that should be RUNNING, not one that waits for
  # somebody to remember to deploy it — that gap is exactly how a workload and the gateway came to
  # run different commits. Railway cannot do this itself here: its auto-deploy watches a connected
  # GITHUB REPO, and every service in this project is an IMAGE service on an immutable tag, which
  # Railway does not poll. So the trigger is external, and it is the same `deploy/railway.py` a
  # person would run — never a dashboard click, never an ad-hoc API call.
  #
  # `release` SETS THE IMAGE AND REDEPLOYS. It writes no environment variables, on purpose: pushing
  # env means holding `.env` — Neon, Entra, Graph, the LiteLLM master key — and putting all of that
  # into GitHub Actions is a far larger blast radius than shipping code deserves. So CD ships CODE
  # and a human ships CONFIGURATION: a new service, a new secret or a changed grant stays a
  # deliberate `substrate up` from a machine that has `.env`.
  #
  # Skipped, not failed, when the Railway secrets are absent — a fork, or a repo whose owner has not
  # wired a project, should still get its image built.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:                 # never two releases racing onto the same project
      group: railway-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4      # railway.py derives the image tag from HEAD

      - name: release
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::no RAILWAY_TOKEN — image built, deploy skipped"; exit 0
          fi
          python deploy/railway.py release            # stdlib only: no pip install needed

      - name: verify — one build everywhere, and it is the one just pushed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          [ -n "$RAILWAY_TOKEN" ] || exit 0
          python deploy/railway.py substrate images
          # what each container SAYS it is, which a tag cannot tell you — a tag that moves under a
          # service that never restarted leaves it serving the previous build
          python deploy/railway.py substrate versions
