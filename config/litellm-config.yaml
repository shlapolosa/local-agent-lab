# LiteLLM gateway — the lab's governance plane (APIM analogue).
# All three traffic classes converge here: /v1 (LLM), /mcp (tools), A2A (later).
# Key store: Neon Postgres (DATABASE_URL in .env). Teams/virtual keys/budgets are live —
# bootstrap with scripts/bootstrap_registry.py; grant MCP access per team via /team/update
# object_permission.mcp_servers. Master key = admin plane only; agents use virtual keys.
#   grant: POST /team/update {"team_id": "<id>", "object_permission": {"mcp_servers":
#          ["semantic_mcp", "storage_mcp", "ea_mcp", "workflow_mcp"]}}  — a key with no
#   grant sees ZERO tools. workflow_mcp goes to the teams that TRIGGER processes (an
#   orchestrator agent, the Copilot Studio connector), not to the workload's own agents.
# PER-TOOL ACL — REQUIRED on workflow_mcp, which carries BOTH the process tools and the
#   human-in-the-loop APPROVAL GATE (approvals_list / approvals_get / approvals_decide).
#   `approvals_decide` records a PERSON's decision to release an EA-repository write, so a
#   team gets it ONLY if its caller authenticates a human (a Copilot Studio/Teams agent, the
#   review app). Grant it with mcp_tool_permissions on the same object_permission:
#     read-only  {"mcp_servers": ["workflow_mcp"], "mcp_tool_permissions":
#                 {"workflow_mcp": ["visio_to_archimate_submit", "visio_to_archimate_status",
#                                   "visio_to_archimate_result", "approvals_list", "approvals_get"]}}
#     + decide   … the same list + "approvals_decide"      (lab.platform.contracts.ApprovalTools
#                                                           READ / WRITE are these two sets)
#     + retire   … + "approvals_withdraw" — housekeeping only (ApprovalTools.RETIRE). It closes a
#                  stale question so nobody can answer it; grant it to an operator, never together
#                  with decide by reflex, and never to anything that runs unattended.
#   An agent that can submit a run AND approve it is not human-in-the-loop at all — nor is one that
#   can retire its own gate. Never grant workflow_mcp to a workload's own agents (a workload gets
#   ApprovalTools.RAISE and nothing else at the gate), and never without the tool list.
# PER-TOOL ACL — REQUIRED on collab_mcp too, for the same reason in a different shape. Its
#   READ tools query a collaboration tenant and fetch content into the upload store; its
#   THREE WRITE tools (collab_watch / collab_watch_renew / collab_unwatch) manage change-
#   notification SUBSCRIPTIONS, which are egress to a caller-supplied URL and durable objects
#   at the provider that outlive the run that made them. Never grant those to a workload's own
#   agents (lab.platform.contracts.CollabTools READ / WRITE are these two sets):
#     read-only  {"mcp_servers": ["collab_mcp"], "mcp_tool_permissions":
#                 {"collab_mcp": ["collab_capabilities", "collab_sites", "collab_drives",
#                                 "collab_user_drive", "collab_list", "collab_item",
#                                 "collab_meetings", "collab_recordings", "collab_transcripts",
#                                 "collab_fetch", "collab_watches"]}}
#     + watch    … the same list + "collab_watch", "collab_watch_renew", "collab_unwatch"
#   The server holds its OWN provider credential (app-only), so the app registration's
#   permissions are the ceiling for EVERY caller — this ACL is where per-caller narrowing lives.
# Registry UI: http://127.0.0.1:4000/ui  (user: admin, password: the master key).

model_list:
  # --- Anthropic models for developers (upstream credential injected by the gateway) ---
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_UPSTREAM_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_UPSTREAM_API_KEY
  # --- OpenAI chat models (funded 12 Sep 2026): what the use-case agents and the evals run on ---
  # Ollama Cloud's account-wide WEEKLY cap 429'd every kimi-k3 call for days (11-12 Sep 2026), so the
  # use-case workloads moved: `config.USECASE_AGENT_MODEL` names the model, the agent cards and the
  # provisioning read it from there, and a switch is that one value. gpt-5.4-mini measured 2.7 s on
  # a JSON-mode frame with no reasoning tokens spent; gpt-4.1 is the non-reasoning alternative.
  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_UPSTREAM_API_KEY
      input_cost_per_token: 0.00000025
      output_cost_per_token: 0.00000200
    model_info:
      supports_function_calling: true
      supports_vision: true
  - model_name: gpt-4.1
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_UPSTREAM_API_KEY
      input_cost_per_token: 0.00000200
      output_cost_per_token: 0.00000800
    model_info:
      supports_function_calling: true
      supports_vision: true
  # --- more Ollama Cloud models for developers (OpenAI-compatible) ---
  - model_name: kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.00000060
    model_info:                        # Ollama Cloud /api/show declares 'vision' for this model;
      supports_vision: true            # image parts pass through the gateway (verified) — the BA
                                       # reads diagram images inline with it
      supports_function_calling: true
  - model_name: kimi-k2.7-code          # coding-focused, ~30% lower thinking-token usage
    model_info: {supports_vision: true, supports_function_calling: true}   # per Ollama /api/show
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.00000060
  # --- `auto` resolves via src/lab/substrate/gateway/auto_router.py BEFORE routing; this entry makes it a
  #     listable model and the fallback if the hook is ever disabled ---
  - model_name: auto
    model_info: {supports_vision: true, supports_function_calling: true}   # glm-5.3-flash underneath
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
  - model_name: gpt-oss-120b            # lab default reasoning model
    litellm_params:
      model: openai/gpt-oss:120b        # Ollama Cloud is OpenAI-compatible
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
      input_cost_per_token: 0.00000015   # nominal USD/token so budgets meter (Ollama Cloud is flat-rate)
      output_cost_per_token: 0.00000060
  - model_name: glm-flash               # cheap/fast utility model
    model_info: {supports_vision: true, supports_function_calling: true}   # per Ollama /api/show
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY
      input_cost_per_token: 0.00000005
      output_cost_per_token: 0.00000020

  # --- the reference corpus's EMBEDDING model: the substrate's OWN, over the private network ---
  # reference-mcp and the publisher embed THROUGH the gateway with a virtual key (REFERENCE_EMBED_KEY).
  # The model runs in the `embedder` substrate service (deploy/railway.py: an Ollama image with a
  # volume, ~300 MB, internal only) — chosen over a vendor API on 10 Sep 2026 because Ollama Cloud,
  # OpenRouter and Anthropic serve no embedding model and the OpenAI account had no credit; a
  # provider change is this one entry plus EMBED_URL. No api_key: nothing on the private network
  # authenticates, the same as Redis. `output_vector_size` is the model's native width and
  # REFERENCE_EMBED_DIM must equal it (a governance test holds the two together).
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/EMBED_URL
      input_cost_per_token: 0.00000001
    model_info:
      mode: embedding
      output_vector_size: 768
  # --- the VENDOR embedding model (OpenAI funded 12 Sep 2026), served beside the substrate's own ---
  # Not yet the one the corpus embeds with: REFERENCE_EMBED_MODEL / REFERENCE_EMBED_DIM name that,
  # and a switch is a MIGRATION (vectors from two models are not comparable) — a new corpus version
  # embedded end to end, measured with scripts/eval_coverage.py against the recorded baseline
  # before it is adopted. 3072 is the native width; the same model ships on the production target
  # as "Embeddings 3 Large", so the choice is portable. The key is the gateway's, never a workload's.
  - model_name: text-embedding-3-large
    litellm_params:
      model: openai/text-embedding-3-large
      api_key: os.environ/OPENAI_UPSTREAM_API_KEY
      input_cost_per_token: 0.00000013
    model_info:
      mode: embedding
      output_vector_size: 3072

mcp_servers:                          # addresses + trust come from the environment (cloud shape)
  ea_mcp:                             # the EA-repository PORT, vendor-neutral by design: swapping ADOIT
    url: os.environ/ADOIT_MCP_URL      # for another EA tool is a different server registering the same
    transport: http                    # ea_* tools under THIS alias — no workload change. The SERVICE
    auth_type: bearer_token            # behind it is vendor-named (adoit-mcp, ADOIT_MCP_URL, its creds).
    authentication_token: os.environ/MCP_SHARED_SECRET
    description: EA repository — read the existing architecture (ea_search/ea_object), stage a model for a human-approved import (ea_stage_import); plus the ArchiMate engine (validate/render)
    extra_headers: ["traceparent", "tracestate"]   # forward W3C trace context -> one trace across all hops
  semantic_mcp:
    url: os.environ/SEMANTIC_MCP_URL
    transport: http
    auth_type: bearer_token
    authentication_token: os.environ/MCP_SHARED_SECRET
    description: Semantic layer — vocabularies as data (ArchiMate 3.1 first), classification, exact relationship legality, SPARQL over models; the Documentation Fabric's four metadata products (catalog, traceability edges at provenance rungs, vocabulary links, similarity facade) — PIPELINE and PROMOTE tools are granted per team, never to a workload's own agents
    extra_headers: ["traceparent", "tracestate"]
  storage_mcp:                        # READ-ONLY governed access to the upload store (bucket): the
    url: os.environ/STORAGE_MCP_URL   # only way an agent/workload reaches an input object — the
    transport: http                   # bucket credentials live in storage-mcp, never in a workload
    auth_type: bearer_token
    authentication_token: os.environ/MCP_SHARED_SECRET
    description: Governed read-only object store — list/info/get(normalised image)/read_document/read_vsdx/extract_figures over art:// refs
    extra_headers: ["traceparent", "tracestate"]
  workflow_mcp:                       # the front door to every BUSINESS PROCESS: three generated tools
    url: os.environ/WORKFLOW_MCP_URL  # per process (<process>_submit/_status/_result). Async by contract:
    transport: http                   # submit enqueues a workflow:requests event and returns a request_id
    auth_type: bearer_token           # immediately (a run takes 600-1000 s), status/result poll it.
    authentication_token: os.environ/MCP_SHARED_SECRET   # + the APPROVAL GATE a run pauses at
    description: Business processes as governed tools — submit a run, poll its status, read its results (async; inputs are art:// refs); plus the human-in-the-loop approval gate — list/read what is awaiting a person and record THEIR decision (approvals_decide needs the signed-in human as `actor`; see the per-tool ACL note at the top of this file)
    extra_headers: ["traceparent", "tracestate"]
  collab_mcp:                         # the COLLABORATION port — files and meetings, vendor-neutral:
    url: os.environ/GRAPH_MCP_URL     # the SERVICE behind this alias is graph-mcp (Microsoft Graph,
    transport: http                   # GRAPH_* credentials); another collaboration platform is a
    auth_type: bearer_token           # different adapter under THIS alias — no workload change.
    authentication_token: os.environ/MCP_SHARED_SECRET   # + a PER-TOOL ACL: see the note at the top
    description: Collaboration — the files people keep and the meetings they hold; find sites, document libraries and a person's own drive, list files and read their metadata, list meetings with their recordings and transcripts, and fetch any of it into the lab's upload store as an art:// reference (content is never returned inline); collab_capabilities reports what this tenant actually allows and why not
    extra_headers: ["traceparent", "tracestate"]
  speech_mcp:                         # the SPEECH port — recorded talk -> attributable words.
    url: os.environ/SPEECH_MCP_URL    # The SERVICE behind this alias holds the provider credential;
    transport: http                   # another speech provider is a different adapter under THIS
    auth_type: bearer_token           # alias — no workload change. It returns WORDS AND SPEAKER
    authentication_token: os.environ/MCP_SHARED_SECRET   # LABELS ONLY: minutes and keywords are
    description: Speech — transcribe a recording already in the lab's upload store into timed, speaker-labelled segments, returned by art:// reference with an anonymous speaker digest inline; pass every language the meeting uses (e.g. Arabic and English together) so speech that switches language mid-sentence is transcribed rather than translated; video is accepted and its audio extracted; it does NOT summarise — minutes and keywords come from the lab's own governed model
    extra_headers: ["traceparent", "tracestate"]

  reference_mcp:                      # the governed CORPUS — signed, versioned artifacts under a pin.
    url: os.environ/REFERENCE_MCP_URL # READ-ONLY at three levels that each hold alone: no write tool
    transport: http                   # in the catalogue, none in the adapter, and the database
    auth_type: bearer_token           # refuses writes from the role the service runs as. Publishing
    authentication_token: os.environ/MCP_SHARED_SECRET   # is an operator CLI, never a tool.
    description: Reference corpus — the organisation's governed rules as data — guardrail predicates, criticality and determinism registers, facet schema, risk-class mapping, reference architecture, price sheet and rate cards. Call reference_pin FIRST and pass its pin_id to every read, so one run cannot read two artifacts at different versions. reference_lookup is EXACT over records by their published natural key and a miss is a real answer; reference_search is semantic over explanatory prose and refuses outright on a stale or differently-embedded index rather than returning less. Every answer carries citations naming the artifact version and the human-readable master a person can open
    extra_headers: ["traceparent", "tracestate"]

  decision_mcp:                       # the CAFÉ derivations that are DETERMINISTIC.
    url: os.environ/DECISION_MCP_URL  # Deployed, not run inside a workload, because they read
    transport: http                   # governed artifacts that change under approval — a taxonomy
    auth_type: bearer_token           # edit must not need an application release. Conformance
    authentication_token: os.environ/MCP_SHARED_SECRET   # review runs the same rules.
    description: CAFÉ derivations — the deterministic assessments of an AI use case, over step facet vectors rather than judgement. decision_readiness rules on the four M0 gates; decision_feasibility applies the published verdict rule and says whether the run must halt; decision_exposure derives how bad a step is when it works and when it is WRONG (an advisory step can carry the highest influence in the workflow); decision_obligations evaluates every guardrail predicate and the commit invariant into a control requirement set; decision_composition derives the component families the steps call for, and names any obligation that resolves to no enforcement point. Pass a pin_id from reference_pin to derive against the governed corpus — every answer says which rules it used
    extra_headers: ["traceparent", "tracestate"]

  valuation_mcp:                      # the CAFÉ derivations that are FINANCIAL. A SEPARATE server
    url: os.environ/VALUATION_MCP_URL # from decision_mcp because the artifacts behind it have a
    transport: http                   # different owner and cadence: finance releases the price
    auth_type: bearer_token           # sheet and the rate cards, architecture governance releases
    authentication_token: os.environ/MCP_SHARED_SECRET   # the guardrails. Neither release may
    description: CAFÉ valuation — the financial derivations for an AI use case. valuation_cost prices the reference-topology tiles a composed design switched on against the reference price sheet, carrying a low/expected/high range rather than collapsing it, raising a GAP FLAG for any resource with no price line rather than substituting a proxy, and naming the sheet version it costed against. valuation_benefit computes exactly the three admitted drivers (operational efficiency, quality and accuracy, compliance and risk reduction), the Year-1 investment, payback and three-year ROI, and the proceed / proceed-with-conditions / defer recommendation. A driver whose inputs nobody supplied comes back requires_input, which is not zero — and while one is open, proceed is unavailable and the case is not deferred on it either
    extra_headers: ["traceparent", "tracestate"]   # require the other's redeploy.

router_settings:                      # Redis: shared state for rate limits, budgets, router
  redis_host: os.environ/REDIS_HOST   # Redis Cloud (or local brew redis — see .env)
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

  # Prefixed ALIASES, so a developer can SEE the non-Claude models in Claude Code's `/model`.
  # Claude Code's gateway model discovery keeps a model only when its id contains "claude" or
  # "anthropic" (its gateway compatibility guide, "Model discovery"), so `kimi-k3` and friends were
  # always callable BY NAME and never listed — and the picker is how a developer chooses one.
  # Measured 8 Sep 2026 on a throwaway gateway: 12 models served, exactly the 7 matching ids cached.
  #
  # An ALIAS, not a rename, and that distinction is the whole design: `model_group_alias` resolves
  # to the SAME model group, so there is one deployment, one spend identity, and every existing
  # caller of `kimi-k3` — workload code, each agent key's `models` list, the allowlist below — keeps
  # working untouched. Verified live on BOTH surfaces, Anthropic /v1/messages and OpenAI
  # /v1/chat/completions, for the alias and the original.
  #
  # The cost, stated: /v1/models is ONE endpoint, so an OpenAI-spec client sees these names too and
  # the catalogue reads as 12 entries for 7 models.
  model_group_alias:
    claude/kimi-k3: {model: kimi-k3, hidden: false}
    claude/kimi-k2.7-code: {model: kimi-k2.7-code, hidden: false}
    claude/gpt-oss-120b: {model: gpt-oss-120b, hidden: false}
    claude/glm-flash: {model: glm-flash, hidden: false}
    claude/auto: {model: auto, hidden: false}

# RELEVANCE RETRIEVAL over the governed corpus goes through this gateway's VECTOR STORES — one per
# vector-mode reference artifact, the store id being the artifact id, so a team's
# `object_permission.vector_stores` grants it ONE map and not the corpus. They are NOT declared here.
# A `vector_store_registry:` block loads into memory at start, but with a database configured the
# database is the source of truth and the list endpoint DELETES any in-memory store it does not find
# there (verified live, 1.98: the block loaded, one `GET /vector_store/list` later the registry held
# zero stores and a search fell through to OpenAI's own vector-store API). So the stores live in the
# gateway's database like teams and keys do, reconciled on every deploy by
# scripts/register_vector_stores.py from lab.platform.contracts.VectorStores — the one declaration.
# Their provider is `pg_vector`, an HTTP client, pointed at reference-mcp's OpenAI-shaped façade
# (lab.substrate.mcp.reference.vectorstore) over the SAME `pg_library.search` the MCP tool uses —
# pins, signatures and the consumption trail included; `filters` MUST carry the run's
# pin_id/run_id/process/field or the façade answers 400. NO credential is stored with a store:
# LiteLLM resolves no `os.environ/` on this path, so the provider's own PG_VECTOR_API_BASE /
# PG_VECTOR_API_KEY are set in the gateway's PROCESS environment (lab.sh locally, deploy/railway.py
# substrate_env in the cloud) from the reference-mcp origin and MCP_SHARED_SECRET. `file_search`
# tool injection stays OFF (no vector_store_pre_call_hook): it carries no pin.

general_settings:
  # WITHOUT THIS, AGENTS ARE WRITTEN TO POSTGRES AND NEVER READ BACK. Root-caused in LiteLLM's own
  # source (proxy/proxy_server.py, v1.98.0): `_init_agents_in_db` — the DB -> in-memory registry
  # load — is reachable only through `add_deployment`, and `add_deployment` is scheduled and awaited
  # only inside `if store_model_in_db is True`. The `is not True` branch carries an explicit
  # exemption for MCP servers ("DB-backed MCP servers are live objects in every mode") and agents
  # were left out of it. So `POST /v1/agents` persisted a row, the gateway restarted, `GET
  # /v1/agents` answered `200 []` over rows that were still there, and re-publishing failed with
  # `500 Unique constraint failed on the fields: (agent_name)` — the registry pane empty after every
  # deploy while the store was correct all along.
  #
  # Measured before enabling it, because this also makes the proxy overlay models and settings from
  # the database: `LiteLLM_Config`, `LiteLLM_ProxyModelTable`, `LiteLLM_ConfigOverrides`,
  # `LiteLLM_SSOConfig` and `LiteLLM_CacheConfig` are ALL EMPTY on this deployment, so there is
  # nothing to overlay and this file remains the only source of models and settings. If a model is
  # ever added through the UI that stops being true — which is the point of the setting, and worth
  # knowing before somebody does it.
  #
  # Guarded by tests/governance/test_agent_registry_parity.py: removing this line silently empties
  # the agent registry on the next restart, which is exactly the kind of failure that goes unnoticed.
  store_model_in_db: true

  # The REST ingress of workflow-frontdoor, reached THROUGH the gateway so it inherits the whole
  # governance plane: custom_auth validates an Entra token (issuer, audience, signature against the
  # tenant's JWKS) and maps the app registration to its virtual key, so a REST caller gets exactly
  # the grants, metering and tracing an MCP caller gets. There is no second implementation of "who
  # is calling" — which is how two surfaces would start disagreeing.
  #
  # `auth: true` is REQUIRED. An entry without it is genuinely open to anyone who can reach the
  # gateway, which for a door that starts business processes and records human decisions would be
  # the worst possible default.
  # ONE entry with include_subpath, not a route list: every /api/... path on the front door is
  # covered, including the poll URL a flow hits every few seconds, and adding a process adds no
  # config here. A per-path list would have to be kept in step with a registry it cannot see.
  #
  # `auth: true` is REQUIRED. Without it the entry is genuinely open to anyone who can reach the
  # gateway — for a door that starts business processes and records human decisions, the worst
  # possible default. With it, LiteLLM runs its normal key auth, which includes the lab's
  # custom_auth hook: an Entra token is validated (issuer, audience, signature via the tenant's
  # JWKS) and mapped to the caller's virtual key. That is the APIM `validate-jwt` policy's stand-in.
  #
  # WHAT THIS DOES NOT DO: per-operation authorisation. `mcp_tool_permissions` is keyed by MCP
  # server and tool name, and a REST path is neither — so a valid key reaching /api can call any
  # /api route. APIM does this natively with a policy per operation; until then the front door
  # itself must check the caller's role, which is why the identity is forwarded below.
  pass_through_endpoints:
    - path: "/api"
      target: "os.environ/WORKFLOW_API_URL"
      include_subpath: true
      auth: true
      headers:
        # the front door trusts the gateway, exactly as it does on /mcp
        Authorization: "Bearer os.environ/MCP_SHARED_SECRET"

  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: true       # populates the UI Health tab; each cycle pings every model
  health_check_interval: 3600          # hourly — pings cost a few tokens per model (incl. Anthropic)
  custom_auth: lab.substrate.gateway.custom_auth.user_api_key_auth   # Entra JWTs (APIM validate-jwt analogue); static keys fall through

litellm_settings:
  drop_params: true
  default_internal_user_params:        # SSO (Entra) sign-ins: non-admin devs, self-serve a durable key
    user_role: "internal_user"
    max_budget: 10.0
    budget_duration: "30d"
    # The aliases are named HERE too, or a developer identity cannot see them however the
    # catalogue is configured: this is a per-USER restriction, and it is what limited an Entra
    # identity to 7 models while the master key saw 12. NOTE it applies at user CREATION, so an
    # existing developer keeps the list they were provisioned with until their key is updated.
    models: ["gpt-oss-120b", "glm-flash", "kimi-k3", "kimi-k2.7-code", "claude-sonnet-5", "claude-haiku-4-5", "auto",
             "gpt-5.4-mini", "gpt-4.1",
             "claude/kimi-k3", "claude/kimi-k2.7-code", "claude/gpt-oss-120b", "claude/glm-flash", "claude/auto"]
  callbacks: ["otel"]                 # every gateway call -> OTLP span (joins the caller's trace)
  cache: true                         # Redis backs limiter/budget/router state ...
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    supported_call_types: []          # ... but never caches LLM responses

# PII / secret protection — REVERSIBLE PSEUDONYMIZATION (agreed policy, no blocking):
# outbound prompts have every match replaced by [TYPE#n] before egress (model never sees the
# real value); the gateway restores originals in the response. Mapping lives only in request
# metadata on this gateway. Patterns come from LiteLLM's prebuilt library incl. UAE ids.
# Streaming responses keep placeholders (safe; restore-on-stream is a later refinement).
guardrails:
  - guardrail_name: auto-router
    litellm_params:
      guardrail: lab.substrate.gateway.auto_router.AutoRouter
      mode: pre_call
      default_on: true
  - guardrail_name: reversible-pii
    litellm_params:
      guardrail: lab.substrate.gateway.pii_guardrail.ReversiblePII
      mode: [pre_call, post_call]
      default_on: true
