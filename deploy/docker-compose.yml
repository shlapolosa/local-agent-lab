# Same topology as lab.sh, but every service on its own host name — the cloud shape, run
# anywhere with a compose engine. State lives outside the compose (Neon, Redis Cloud,
# artifact store in Postgres); only Jaeger is local here and is swapped for App Insights /
# Tempo in a real deployment by pointing OTEL_* elsewhere.
# Usage: docker compose --env-file ../.env -f deploy/docker-compose.yml up --build
x-lab: &lab
  build: { context: .., dockerfile: deploy/Dockerfile }
  env_file: [../.env]
  environment:
    BIND_HOST: 0.0.0.0
    GATEWAY_URL: http://gateway:4000
    ADOIT_MCP_URL: http://adoit-mcp:9100/mcp
    SEMANTIC_MCP_URL: http://semantic-mcp:9200/mcp
    STORAGE_MCP_URL: http://storage-mcp:9300/mcp
    REVIEW_APP_URL: ${REVIEW_APP_URL:-http://localhost:8501}
    JAEGER_UI_URL: ${JAEGER_UI_URL:-http://localhost:16686}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://jaeger:4318/v1/traces}
  restart: unless-stopped
services:
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports: ["16686:16686", "4318:4318"]
  adoit-mcp:
    <<: *lab
    command: ["python", "mcp/adoit_mcp/server.py"]
    volumes: ["../semantic/reference/sources:/app/semantic/reference/sources:ro"]
  semantic-mcp:
    <<: *lab
    command: ["python", "mcp/semantic_mcp/server.py"]
    volumes: ["../semantic/reference/sources:/app/semantic/reference/sources:ro"]
  storage-mcp:                # read-only governed upload store (holds S3_*/UPLOADS_URL; workloads never do)
    <<: *lab
    command: ["python", "mcp/storage_mcp/server.py"]
  gateway:
    <<: *lab
    command: ["litellm", "--config", "gateway/litellm-config.yaml", "--port", "4000"]
    environment:
      OTEL_SERVICE_NAME: litellm-gateway
    ports: ["4000:4000"]
    depends_on: [adoit-mcp, semantic-mcp, storage-mcp]
  review:
    <<: *lab
    command: ["streamlit", "run", "review/app.py", "--server.port", "8501", "--server.headless", "true"]
    ports: ["8501:8501"]
  telegram:
    <<: *lab
    command: ["python", "channels/telegram.py"]
