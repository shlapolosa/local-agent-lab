# Jaeger v2 all-in-one for Railway: receivers must bind 0.0.0.0 (the collector defaults to
# localhost, which Railway's proxy cannot reach). In-memory storage. Delivered to the container
# as the JAEGER_CONFIG env var and started with `--config env:JAEGER_CONFIG`.
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    logs: { level: info }
extensions:
  healthcheckv2:
    use_v2: true
    http: { endpoint: "0.0.0.0:13133" }
  jaeger_query:
    storage: { traces: memstore }
    http: { endpoint: "0.0.0.0:16686" }
    grpc: { endpoint: "0.0.0.0:16685" }
  jaeger_storage:
    backends:
      memstore:
        memory: { max_traces: 100000 }
receivers:
  otlp:
    protocols:
      grpc: { endpoint: "0.0.0.0:4317" }
      http: { endpoint: "0.0.0.0:4318" }
processors:
  batch: {}
exporters:
  jaeger_storage_exporter: { trace_storage: memstore }
