# SUBSTRATE — the shared platform plane, deployed ONCE and referenced by every workload.
# Governance (gateway), shared tools (semantic-mcp, adoit-mcp, storage-mcp, workflow-mcp, graph-mcp),
# the human approval gate (review),
# and local tracing. All durable state lives OUTSIDE this compose (Neon, Redis Cloud, artifact
# store in Postgres); on Railway, tracing is the remote Jaeger instead of the local one here.
#
# The gateway is the ONLY public door a workload uses. Every MCP server is internal to the
# substrate network — workloads reach their tools only THROUGH the gateway (/mcp), never directly.
#
# Usage (local, needs a Docker engine):
#   docker compose --env-file ../../.env -f deploy/substrate/compose.yml up --build
# Workloads then join this network (see deploy/workloads/<name>/compose.yml).
x-sub: &sub
  build: { context: ../.., dockerfile: deploy/Dockerfile }
  env_file: [../../.env]
  environment:
    BIND_HOST: 0.0.0.0
    GATEWAY_URL: http://gateway:4000
    ADOIT_MCP_URL: http://adoit-mcp:9100/mcp
    SEMANTIC_MCP_URL: http://semantic-mcp:9200/mcp
    STORAGE_MCP_URL: http://storage-mcp:9300/mcp
    GRAPH_MCP_URL: http://graph-mcp:9500/mcp
    REVIEW_APP_URL: ${REVIEW_APP_URL:-http://review:8501}
    JAEGER_UI_URL: ${JAEGER_UI_URL:-http://jaeger:16686}
    # the substrate's own Redis (service above) — overrides the machine-local .env value, which
    # inside a container would point at the container itself. HOST/PORT/PASSWORD feed litellm's
    # router_settings; URL feeds everything else (src/lab/substrate/approvals.py, litellm cache).
    REDIS_URL: redis://redis:6379/0
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ""
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://jaeger:4318/v1/traces}
  restart: unless-stopped
  networks: [substrate]

networks:
  substrate:
    name: substrate            # a stable, external-joinable name so workloads can attach

volumes:
  redis-data: {}               # approval streams + limiter state survive a restart

services:
  redis:                       # substrate Redis: limiter/budget/router state + the approval streams
    # Lives IN the substrate (not Redis Cloud) since Sep 2026: LiteLLM opens two 50-connection
    # pools + pub/sub subscribers per gateway, which blew Redis Cloud's 30-client free-tier cap,
    # and co-locating removes the ~180 ms cross-region RTT (+3.8 s/gateway request measured).
    # --bind 0.0.0.0 ::  -> dual-stack: Railway private DNS is IPv6-only and a v4-only bind is
    # unreachable there (same bug class as the gateway's edge/healthcheck split). No password:
    # reachable only on the private substrate network, hence --protected-mode no.
    image: redis:7-alpine
    command: ["redis-server", "--bind", "0.0.0.0", "::", "--protected-mode", "no",
              "--appendonly", "yes", "--dir", "/data"]
    volumes: ["redis-data:/data"]
    networks: [substrate]
    restart: unless-stopped
  jaeger:                      # local tracing; on Railway this is the remote Jaeger (OTEL_* point at it)
    image: jaegertracing/jaeger:2.20.0
    ports: ["16686:16686", "4318:4318"]
    networks: [substrate]
    restart: unless-stopped
  semantic-mcp:               # shared read-only vocabulary/validation — internal only
    <<: *sub
    command: ["python", "-m", "lab.substrate.mcp.semantic.server"]
    volumes: ["../../semantic/reference/sources:/app/semantic/reference/sources:ro"]
  adoit-mcp:                  # shared governed EA-repository facade — internal only
    <<: *sub
    command: ["python", "-m", "lab.substrate.mcp.adoit.server"]
    volumes: ["../../semantic/reference/sources:/app/semantic/reference/sources:ro"]
  storage-mcp:                # READ-ONLY governed object store (uploads) — internal only. Holds the
    <<: *sub                  # bucket credentials (S3_*/UPLOADS_URL from .env); workloads never do.
    command: ["python", "-m", "lab.substrate.mcp.storage.server"]
  workflow-mcp:               # the governed FRONT DOOR to every business process (submit/status/result
    <<: *sub                  # + the approval tools). Redis + tracing only — holds NO store credential.
    command: ["python", "-m", "lab.substrate.mcp.workflow.server"]
  graph-mcp:                  # the COLLABORATION port (gateway alias collab_mcp) — internal only.
    <<: *sub                  # Holds the provider credential (GRAPH_*) AND bucket credentials:
    command: ["python", "-m", "lab.substrate.mcp.graph.server"]   # collab_fetch streams content in.
  gateway:                    # the single governance plane — the only public door
    <<: *sub
    command: ["litellm", "--config", "config/litellm-config.yaml", "--port", "4000"]
    environment:
      BIND_HOST: 0.0.0.0
      GATEWAY_URL: http://gateway:4000
      ADOIT_MCP_URL: http://adoit-mcp:9100/mcp
      SEMANTIC_MCP_URL: http://semantic-mcp:9200/mcp
      STORAGE_MCP_URL: http://storage-mcp:9300/mcp
      WORKFLOW_MCP_URL: http://workflow-mcp:9400/mcp
      GRAPH_MCP_URL: http://graph-mcp:9500/mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_SERVICE_NAME: litellm-gateway
      # Neon is already migrated by the native bootstrap (scripts/bootstrap_registry.py). A container
      # has no local prisma migration state, so WITHOUT this it re-baselines + resolves all ~152
      # migrations one-by-one against REMOTE Neon on every cold start (~20s each ≈ tens of minutes,
      # verified). Skip schema management in containers; migrate the DB once, natively.
      DISABLE_SCHEMA_UPDATE: "true"
    ports: ["4000:4000"]
    depends_on: [adoit-mcp, semantic-mcp, storage-mcp, workflow-mcp, graph-mcp]
  review:                     # human approval gate (cross-cutting) — public, password-gated
    <<: *sub
    command: ["streamlit", "run", "src/lab/substrate/review/app.py", "--server.port", "8501", "--server.headless", "true"]
    ports: ["8501:8501"]

  # --- approval channels: OPTIONAL, started only when configured (mirrors deploy/railway.py CHANNELS
  # and lab.sh's table). `docker compose --profile channels up` to run them.
  telegram:
    <<: *sub
    profiles: ["channels"]
    command: ["python", "-m", "lab.substrate.channels.telegram"]
  teams:
    <<: *sub
    profiles: ["channels"]
    command: ["python", "-m", "lab.substrate.channels.teams"]
