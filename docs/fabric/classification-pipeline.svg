<text x="60" y="42" font-size="25" font-weight="700" fill="#222">Classifying an artifact — as-is, and the proposed inversion</text>
<text x="60" y="66" font-size="13.5" font-weight="400" fill="#555" font-style="italic">Today the classifier is given the taxonomy and asked what fits. Proposed: read the artifact first, say what it is about, match afterwards.</text>
