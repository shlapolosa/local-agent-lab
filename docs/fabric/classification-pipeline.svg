<text x="60" y="876" font-size="13" font-weight="700" fill="#333">The four signals, and where each is produced</text>
<text x="60" y="898" font-size="11.5" font-weight="700" fill="#1e8449">salience     </text>
<text x="160" y="898" font-size="11.5" font-weight="400" fill="#555">step 2 — is this what the artifact is about?</text>
<text x="60" y="917" font-size="11.5" font-weight="700" fill="#1e8449">grounding    </text>
<text x="160" y="917" font-size="11.5" font-weight="400" fill="#555">step 3 — is there textual evidence for it?</text>
<text x="60" y="936" font-size="11.5" font-weight="700" fill="#1e8449">match        </text>
<text x="160" y="936" font-size="11.5" font-weight="400" fill="#555">step 5 — how well does it map to an admitted concept?</text>
<text x="60" y="955" font-size="11.5" font-weight="700" fill="#1e8449">specificity  </text>
<text x="160" y="955" font-size="11.5" font-weight="400" fill="#555">link — is the concept rare enough to carry one?</text>
<text x="60" y="1000" font-size="11.5" font-weight="400" fill="#777">× fidelity of the rendering — a concept grounded in one provider's transcript is weaker evidence than the same concept in the document itself.</text>
<text x="60" y="1022" font-size="11.5" font-weight="400" fill="#999">Grey is today, green is proposed. Amber is a person. This diagram carries NO status axis: its grey is not the pitch picture's “built and deliberately off”.</text>
<text x="60" y="1044" font-size="11.5" font-weight="400" fill="#999">Unchanged, and shown dashed for honesty about scope: document TYPE stays a closed-set choice, and CITATIONS stay their own path (doc →references→ doc).</text>
