<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 940" width="1680" height="940" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
<rect width="1680" height="940" fill="#fff"/>
<text x="60" y="36" font-size="22" font-weight="700" fill="#222">The Documentation Fabric — who does what, when and where</text>
<text x="60" y="54" font-size="12.5" font-style="italic" fill="#555">Microsoft retrieves; the fabric vouches — the two meet in the assistant, at the moment a question is answered, never by pre-merging one into the other’s store.</text>
<rect x="50" y="60" width="1580" height="110" fill="#fbf7f0" stroke="#c9c9c9"/>
<text x="70" y="109.0" transform="rotate(-90 70 115.0)" text-anchor="middle" font-size="15" font-weight="700" fill="#555">AUTHOR</text>
<text x="86" y="119.0" transform="rotate(-90 86 115.0)" text-anchor="middle" font-size="10.5" fill="#888">writes where they already work</text>
<rect x="50" y="170" width="1580" height="130" fill="#f2f2f2" stroke="#c9c9c9"/>
<text x="70" y="229.0" transform="rotate(-90 70 235.0)" text-anchor="middle" font-size="15" font-weight="700" fill="#555">SYSTEMS OF RECORD</text>
<text x="86" y="239.0" transform="rotate(-90 86 235.0)" text-anchor="middle" font-size="10.5" fill="#888">SharePoint · ADO · APIM · EA — content stays here</text>
<rect x="50" y="300" width="1580" height="310" fill="#f7f5fc" stroke="#c9c9c9"/>
<text x="70" y="449.0" transform="rotate(-90 70 455.0)" text-anchor="middle" font-size="15" font-weight="700" fill="#555">THE FABRIC</text>
<text x="86" y="459.0" transform="rotate(-90 86 455.0)" text-anchor="middle" font-size="10.5" fill="#888">pointers, facets, relations — and how each fact is known</text>
<rect x="50" y="610" width="1580" height="160" fill="#fbf7f0" stroke="#c9c9c9"/>
<text x="70" y="684.0" transform="rotate(-90 70 690.0)" text-anchor="middle" font-size="15" font-weight="700" fill="#555">OWNER · STEWARD</text>
<text x="86" y="694.0" transform="rotate(-90 86 690.0)" text-anchor="middle" font-size="10.5" fill="#888">two questions, two different people</text>
<rect x="50" y="770" width="1580" height="120" fill="#eef7f2" stroke="#c9c9c9"/>
<text x="70" y="824.0" transform="rotate(-90 70 830.0)" text-anchor="middle" font-size="15" font-weight="700" fill="#555">RESEARCHERS · AGENTS</text>
<text x="86" y="834.0" transform="rotate(-90 86 830.0)" text-anchor="middle" font-size="10.5" fill="#888">find, browse, anchor</text>
<circle cx="230" cy="115" r="19" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="230" y="120" text-anchor="middle" font-size="13" fill="#333">&#9654;</text>
<text x="230" y="151" text-anchor="middle" font-size="11" fill="#333">writes a document</text>
<rect x="273.0" y="207.0" width="250" height="56" rx="7" fill="#ededed" stroke="#777777" stroke-width="2"/>
<text x="398" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Stored where it lives</text>
<text x="398" y="250" text-anchor="middle" font-size="11" fill="#555">SharePoint · ADO · APIM — never copied</text>
<path d="M249,115 L398,115 L398,207" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<rect x="273.0" y="332.0" width="250" height="56" rx="7" fill="#f3f0fa" stroke="#5b4b8a" stroke-width="2"/>
<text x="398" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Catalogue the record</text>
<text x="398" y="375" text-anchor="middle" font-size="11" fill="#555">pointer + facets  (the ABox)</text>
<path d="M398,263 L398,332" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<text x="398.0" y="290.5" text-anchor="middle" font-size="11" fill="#666">change event</text>
<rect x="446.0" y="332.0" width="240" height="56" rx="7" fill="#f3f0fa" stroke="#5b4b8a" stroke-width="2"/>
<text x="566" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Classify</text>
<text x="566" y="375" text-anchor="middle" font-size="11" fill="#555">reads the ~100-concept scheme (the TBox)</text>
