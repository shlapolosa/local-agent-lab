<text x="902" y="556" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Re-match what waited</text>
<text x="902" y="575" text-anchor="middle" font-size="11" fill="#555">FR-1.1.5</text>
<path d="M945,680 L902,680 L902,585" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/>
<text x="902.0" y="625.5" text-anchor="middle" font-size="11" fill="#666">on admission</text>
<path d="M777,560 L566,560 L566,388" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/>
<rect x="955.0" y="314.0" width="250" height="52" rx="7" fill="#f3f0fa" stroke="#5b4b8a" stroke-width="2"/>
<text x="1080" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Ask the OWNER</text>
<text x="1080" y="355" text-anchor="middle" font-size="11" fill="#555">one card — type and context</text>
<path d="M1027,345 L955,345" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<rect x="1143.0" y="650.0" width="250" height="60" rx="7" fill="#fdf3e3" stroke="#b9770e" stroke-width="2"/>
