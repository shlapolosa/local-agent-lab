<text x="1268" y="695" text-anchor="middle" font-size="11" fill="#555">one tap · the only way up the ladder</text>
<text x="1156.0" y="668.0" text-anchor="middle" font-size="15" fill="#b9770e">&#9673;</text>
<path d="M1205,345 L1268,345 L1268,650" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<polygon points="1456,656 1480,680 1456,704 1432,680" fill="#fff" stroke="#444" stroke-width="2"/>
