<rect x="1454.0" y="334.0" width="220" height="52" rx="7" fill="#f3f0fa" stroke="#5b4b8a" stroke-width="2"/>
<text x="1564" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Published</text>
<text x="1564" y="375" text-anchor="middle" font-size="11" fill="#555">state + baseline</text>
<path d="M1480,680 L1564,680 L1564,386" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<text x="1564.0" y="526.0" text-anchor="middle" font-size="11" fill="#666">yes</text>
<rect x="1454.0" y="454.0" width="220" height="52" rx="7" fill="#f3f0fa" stroke="#5b4b8a" stroke-width="2"/>
<text x="1564" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Project a page</text>
<text x="1564" y="495" text-anchor="middle" font-size="11" fill="#555">metadata only, never the content</text>
<path d="M1564,386 L1564,454" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<rect x="1138.0" y="804.0" width="260" height="52" rx="7" fill="#e7f3ec" stroke="#1e8449" stroke-width="2"/>
<text x="1268" y="826" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Copilot answers</text>
<text x="1268" y="845" text-anchor="middle" font-size="11" fill="#555">retrieval + the fabric’s facts, merged</text>
<rect x="1454.0" y="804.0" width="220" height="52" rx="7" fill="#e7f3ec" stroke="#1e8449" stroke-width="2"/>
<text x="1564" y="826" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Pages · MCP</text>
<text x="1564" y="845" text-anchor="middle" font-size="11" fill="#555">browse · agents anchor</text>
<path d="M1564,506 L1564,804" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<path d="M1454,830 L1398,830" fill="none" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
<text x="1620" y="918" text-anchor="end" font-size="11" fill="#777">&#9673; human touchpoint &#160;&#160; &#9671; gateway &#160;&#160; dashed = not built yet</text>
<text x="60" y="918" font-size="11" fill="#777">Rungs: O observed &#183; S suggested &#183; X extracted &#183; C constructed &#183; H human-confirmed &#183; D derived &#160;&#8212;&#160; only C&#183;X&#183;H answer &#8220;what does this change break?&#8221;</text>
