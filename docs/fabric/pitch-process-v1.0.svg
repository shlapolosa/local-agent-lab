<text x="735.5" y="463.0" text-anchor="middle" font-size="11" fill="#666">no</text>
<polygon points="1080,446 1104,470 1080,494 1056,470" fill="#fff" stroke="#444" stroke-width="2"/>
<text x="1080" y="475" text-anchor="middle" font-size="15" fill="#555">?</text>
<text x="1080" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#333">threshold?</text>
<text x="1080" y="511" text-anchor="middle" font-size="10" fill="#777">a term seen once is not a concept</text>
